{% load agile %}
{% if is_paginated %}
<nav aria-label="Seiten" class="mt-3">
  <ul class="pagination pagination-sm">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="{% query_with page=None %}&amp;page={{ page_obj.previous_page_number }}">Zurück</a></li>
    {% endif %}
    <li class="page-item active" aria-current="page"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="{% query_with page=None %}&amp;page={{ page_obj.next_page_number }}">Weiter</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
