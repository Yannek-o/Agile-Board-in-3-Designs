{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block breadcrumb %}<a href="{% url 'accounts:profile' %}">Profil</a> / <strong>Passwort</strong>{% endblock %}
{% block content %}
<div class="ab-page-header"><div><div class="eyebrow">Konto</div><h1>Passwort ändern</h1></div></div>
<div class="ab-card" style="max-width:42rem">
  <form method="post">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-accent mt-3">Passwort ändern</button>
  </form>
</div>
{% endblock %}
